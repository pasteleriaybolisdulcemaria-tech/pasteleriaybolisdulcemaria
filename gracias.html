.wrap{max-width:1080px;margin:auto;padding:2.2rem 1.1rem}
h1,h2,h3,.brand span{font-family:"Dancing Script",cursive;font-weight:700}
h2{font-size:clamp(2.2rem,6vw,3.2rem);text-align:center;margin:0 0 1.2rem;text-shadow:0 2px 0 #fff9}
h2::after{content:"♡ ✦ ♡";display:block;font:700 .9rem Nunito;letter-spacing:.5em;color:#fff;text-shadow:0 1px 4px #d94fa688;margin-top:.1rem}
h3{font-size:1.9rem;margin:1rem 0 .6rem;text-align:center}
.top{position:sticky;top:.7rem;z-index:10;max-width:1040px;margin:.7rem auto 0;display:flex;align-items:center;gap:1rem;padding:.45rem .9rem;background:#ffffffd9;backdrop-filter:blur(10px);border-radius:99px;box-shadow:0 8px 24px #d94fa633;border:2px solid #fff}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--tinta);font-size:1.7rem}
.brand img{height:44px;width:44px;border-radius:50%;border:2px solid var(--chicle);object-fit:cover}
nav{display:flex;gap:1.1rem;margin-left:auto;flex-wrap:wrap}
nav a{color:var(--tinta);text-decoration:none;font-weight:800;font-size:.95rem}nav a:hover{color:var(--chicle)}
.cartbtn{border:0;background:linear-gradient(135deg,#ff6fae,#ff9fcf);color:#fff;border-radius:99px;padding:.5rem 1rem;font:800 1rem Nunito;cursor:pointer;box-shadow:0 4px 12px #ff6fae66}
.hero{position:relative;display:grid;grid-template-columns:1.2fr 1fr;gap:2rem;align-items:center;padding:2.4rem;border-radius:44px;border:5px solid #fff;box-shadow:0 18px 50px #d94fa644;
background:radial-gradient(circle at 25% 30%,#c9b3ff99,transparent 50%),radial-gradient(circle at 70% 70%,#a8f0e699,transparent 50%),radial-gradient(circle at 80% 20%,#ffc2e6,transparent 50%),#ffffffcc;overflow:hidden}
.hero::before,.hero::after{content:"✦";position:absolute;color:#fff;font-size:2rem;text-shadow:0 0 12px #ff6fae;animation:tw 2.4s infinite}
.hero::before{top:14px;right:22px}.hero::after{bottom:16px;left:20px;animation-delay:1.2s;font-size:1.5rem}
@keyframes tw{50%{opacity:.3;transform:scale(.7)}}
@keyframes fl{50%{transform:translateY(-10px)}}
.hline{width:min(300px,80%);display:block;margin:0 0 -.4rem}
h1{font-size:clamp(3.6rem,11vw,6.2rem);margin:0;line-height:1;text-shadow:3px 3px 0 #fff}
.eyebrow{font-weight:800;letter-spacing:.22em;text-transform:uppercase;font-size:.85rem;margin:.4rem 0 1rem}
.lead{font-size:1.15rem}
.mascot{width:100%;max-width:370px;justify-self:center;border-radius:50%;aspect-ratio:1;object-fit:cover;border:8px solid #fff;box-shadow:0 14px 36px #d94fa655,0 0 0 8px #ff6fae55;animation:fl 4s ease-in-out infinite}
.row{display:flex;gap:.7rem;flex-wrap:wrap}
.btn{display:inline-block;border:0;cursor:pointer;text-decoration:none;font:800 1rem Nunito;color:#fff;background:linear-gradient(135deg,#ff5fa6,#ff93c8);padding:.75rem 1.4rem;border-radius:99px;margin:.3rem .3rem .3rem 0;box-shadow:0 6px 16px #ff6fae66;transition:transform .15s}
.btn:hover{transform:translateY(-3px) scale(1.03)}
.btn.alt{background:linear-gradient(135deg,#a8ebe0,#cdb8ff);color:var(--tinta);box-shadow:0 6px 16px #a58bff55}
.card{background:#fff;border:3px solid #ffd3ec;border-radius:30px;padding:1.4rem;box-shadow:0 10px 28px #d94fa633}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1.1rem}
.grid .card{text-align:center;transition:transform .2s}.grid .card:hover{transform:translateY(-5px) rotate(-1deg)}
.ico{width:76px;height:76px;margin:0 auto .3rem;display:grid;place-items:center;font-size:2.4rem;border-radius:50%;background:linear-gradient(135deg,#ffe0f1,#e6dcff 60%,#d3f7f2);box-shadow:inset 0 0 0 3px #fff}
.grid h4{margin:.4rem 0 .6rem;font-size:1.05rem}
.note{display:block;width:fit-content;margin:0 auto 1.2rem;background:#fff;border:2px dashed var(--chicle);padding:.55rem 1.1rem;border-radius:99px;font-weight:700;text-align:center}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1.1rem}
.crop{overflow:hidden;aspect-ratio:4/5;border-radius:26px;background:#fff;border:6px solid #fff;box-shadow:0 10px 26px #d94fa644;transition:transform .25s}
.crop:nth-child(odd){transform:rotate(-1.5deg)}.crop:nth-child(even){transform:rotate(1.5deg)}.crop:hover{transform:scale(1.04) rotate(0);z-index:2}
.crop img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.gallery.sm{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));margin-bottom:1.2rem}.crop.sq{aspect-ratio:1}.crop.sq img{object-position:center}
.boli{display:flex;flex-wrap:wrap;gap:1.5rem;align-items:center;max-width:540px;margin:auto}
.bolipic{width:170px;border-radius:24px;flex:none;border:5px solid #fff;box-shadow:0 8px 20px #d94fa644}
.boli h3{text-align:left;margin:0}
.price{font-size:1.7rem;font-weight:800;color:#e0307e;margin:.2rem 0}.price small{font-size:1rem;color:var(--tinta)}
.qty{display:flex;align-items:center;gap:.8rem;margin:.5rem 0}
.qty button{width:38px;height:38px;border-radius:50%;border:2px solid var(--chicle);background:#fff;color:var(--chicle);font-size:1.3rem;font-weight:800;cursor:pointer}
.promo{max-width:660px;margin:auto;text-align:center;border:4px dashed var(--chicle);background:linear-gradient(160deg,#fff,#ffeaf6 60%,#eaf9f6)}
.fire{font-size:1.5rem;font-weight:800}
.social{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.1rem}.social .card{text-align:center}
footer{position:relative;margin-top:3rem;padding:2.2rem 1rem;text-align:center;background:#fff}
footer::before{content:"";position:absolute;left:0;right:0;top:-14px;height:14px;background:radial-gradient(circle at 12px 14px,#fff 12px,transparent 13px) 0 0/24px 14px repeat-x}
.flogo{max-width:300px;width:80%;border-radius:20px;display:block;margin:0 auto 1rem;box-shadow:0 8px 20px #d94fa633}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(380px,100%);background:#fff;padding:1.2rem;transform:translateX(105%);transition:transform .3s;z-index:20;box-shadow:-8px 0 30px #0003;overflow:auto;border-radius:30px 0 0 30px}
.drawer.open{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center}.dh h3{margin:0}.dh button{border:0;background:none;font-size:1.4rem;cursor:pointer}
#cartList{list-style:none;padding:0}#cartList li{display:flex;justify-content:space-between;gap:.5rem;padding:.6rem 0;border-bottom:1px dashed #ffd3ec}
.total{font-size:1.2rem}
@media(max-width:720px){.hero{grid-template-columns:1fr;text-align:center;padding:1.6rem}.hline{margin:auto}.row{justify-content:center}nav{display:none}.cartbtn{margin-left:auto}.top{border-radius:30px}}
</style></head>
<body><main class="wrap"><div class="card promo" id="box"><h2>Verificando tu pago…</h2></div></main>
<script>window.CONFIG={WOMPI_API:"https://production.wompi.co/v1"};</script>
<script>
(async()=>{
 const C=window.CONFIG,box=document.getElementById("box"),id=new URLSearchParams(location.search).get("id");
 const show=(h,b)=>box.innerHTML=`<h2>${h}</h2>${b}<a class="btn" href="/">Volver al inicio</a>`;
 if(!id)return show("Hola 💕","<p>No encontramos información de pago.</p>");
 try{
  const t=(await (await fetch(`${C.WOMPI_API}/transactions/${encodeURIComponent(id)}`)).json()).data;
  if(t.status==="APPROVED"){
   let pdf="";
   if(String(t.reference).startsWith("DM-R-")){
    try{const d=await (await fetch("/api/descarga?id="+encodeURIComponent(id))).json();
     pdf=d.url?`<p><a class="btn alt" href="${d.url}" target="_blank" rel="noopener">📥 Descargar recetario (PDF)</a></p>`:"<p>Escríbenos y te enviamos el recetario.</p>";}
    catch(e){pdf="<p>Escríbenos y te enviamos el recetario.</p>";}
   }
   show("¡Pago aprobado! 🎉",`<p>Gracias por tu compra. Referencia: ${t.reference}</p>${pdf}<p>Escríbenos por Instagram para coordinar tus bolis.</p>`);
  }else if(t.status==="PENDING")show("Pago pendiente ⏳","<p>Recarga esta página en unos minutos.</p>");
  else show("El pago no fue aprobado","<p>Puedes intentarlo de nuevo desde la tienda.</p>");
 }catch(e){show("No pudimos verificar el pago","<p>Escríbenos y lo revisamos contigo.</p>");}
})();
</script></body></html>
